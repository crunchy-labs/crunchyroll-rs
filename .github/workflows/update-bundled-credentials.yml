name: update-bundled-credentials

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check bundled credentials
        id: login
        env:
          EMAIL: example@example.com
          PASSWORD: example
          IS_PREMIUM: "true"
        run: |
          set +e
          output=$(cargo test login_with_credentials --all-features 2>&1)
          set -e

          if echo "$output" | grep -qF "auth.obtain_access_token.client_inactive"; then
            echo "Bundled android tv auth credentials are inactive, updating them"
            echo "login-failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Login failed as expected, the bundled android tv auth credentials are working"
          fi

      - name: Update android tv credentials
        if: steps.login.outputs.login-failed == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/crunchy-labs/artifacts/refs/heads/main/credentials.json -o credentials.json

          tv_basic_auth_token=$(jq -r '.android_tv.basic_auth_token' credentials.json)
          tv_version=$(jq -r '.android_tv.version' credentials.json)
          tv_version_code=$(jq -r '.android_tv.version_code' credentials.json)

          sed -i -E "s|(pub const ANDROID_TV_BASIC_AUTH_TOKEN: &'static str = \").+(\";)|\1${tv_basic_auth_token}\2|" src/auth/builder.rs
          sed -i -E "s|(pub const ANDROID_TV_USER_AGENT: &'static str = \"Crunchyroll/ANDROIDTV/).+( \()|\1${tv_version}_${tv_version_code}\2|" src/auth/builder.rs

      - name: Create pull request
        if: steps.login.outputs.login-failed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/auth/builder.rs
          commit-message: "[update-credentials action] Update android tv auth credentials"
          title: "Update android tv auth credentials"
          base: master
          branch: update-android-tv-credentials
