name: ci

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-login:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: x86_64-unknown-linux-gnu
          - os: windows-latest
            toolchain: x86_64-pc-windows-gnu
          - os: macos-latest
            toolchain: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.toolchain }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --target ${{ matrix.toolchain }} login_anonymously --features "middleware parse __test __test-strict"

  test-compile-with-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.toolchain }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Compile with no default features
        run: cargo build --target ${{ matrix.toolchain }} --no-default-features

      - name: Compile with chrono
        run: cargo build --target ${{ matrix.toolchain }} --no-default-features --features "chrono"

      - name: Compile with experimental-stabilizations
        run: cargo build --target ${{ matrix.toolchain }} --no-default-features --features "experimental-stabilizations"

  test-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.toolchain }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        env:
          ETP_RT: ${{ secrets.ETP_RT }}
          ETP_RT_DEVICE_ID: ${{ secrets.ETP_RT_DEVICE_ID }}
          ETP_RT_DEVICE_TYPE: ${{ secrets.ETP_RT_DEVICE_TYPE }}
          IS_PREMIUM: ${{ secrets.IS_PREMIUM }}
        run: |
          cargo test --tests --no-fail-fast --no-default-features --features "middleware parse __test __test_strict" -- --test-threads=1 \
            --skip login_with_refresh_token \
            --skip login_with_refresh_token_profile_id \
            --skip profiles \
            --skip modify_profile \
            --skip episode_set_playhead \
            --skip clear_watch_history
